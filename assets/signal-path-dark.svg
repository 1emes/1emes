<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" viewBox="0 0 960 120" role="img" aria-label="Sense, learn, connect: a signal travels from an embedded sensor through a neural network to a web interface">
<style>
  .ink2 { stroke: #9AADC1; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .edges line { stroke: #9AADC1; stroke-opacity: .35; stroke-width: 1; }
  .n { fill: #0B1220; stroke: #B6A0FF; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
  .rail { stroke: #9AADC1; stroke-opacity: .45; stroke-width: 1.5; fill: none; stroke-dasharray: 2 5; }
  .pulse { stroke: #57D9E8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 7 200; stroke-dashoffset: 7; animation: travel 8s linear infinite; }
  .led { fill: #F3B66A; animation: blink 8s ease-in-out infinite; }
  .bars rect { fill: #57D9E8; fill-opacity: .55; }
  .bars { animation: glow 8s ease-in-out infinite; }
  .lbl { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #9AADC1; text-anchor: middle; }
  .c0 { animation: pop 8s ease-in-out infinite; animation-delay: 2.9s; }
  .c1 { animation: pop 8s ease-in-out infinite; animation-delay: 3.2s; }
  .c2 { animation: pop 8s ease-in-out infinite; animation-delay: 3.5s; }
  @keyframes travel { 0% { stroke-dashoffset: 7; } 85%, 100% { stroke-dashoffset: -101; } }
  @keyframes pop { 0%, 10%, 100% { fill: #0B1220; transform: scale(1); } 4% { fill: #B6A0FF; transform: scale(1.35); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 6% { opacity: .25; } 12% { opacity: 1; } }
  @keyframes glow { 0%, 78%, 100% { opacity: .7; } 86% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .n, .led, .bars { animation: none; } }
</style>
<!-- sense: embedded sensor package -->
<g class="ink2">
  <rect x="90" y="32" width="82" height="56" rx="6"/>
  <rect x="112" y="46" width="28" height="28" rx="3"/>
  <path d="M100 32 V12 M94 14 L100 8 L106 14"/>
  <line x1="98" y1="26" x2="98" y2="32"/><line x1="98" y1="88" x2="98" y2="94"/><line x1="110" y1="26" x2="110" y2="32"/><line x1="110" y1="88" x2="110" y2="94"/><line x1="122" y1="26" x2="122" y2="32"/><line x1="122" y1="88" x2="122" y2="94"/><line x1="134" y1="26" x2="134" y2="32"/><line x1="134" y1="88" x2="134" y2="94"/><line x1="146" y1="26" x2="146" y2="32"/><line x1="146" y1="88" x2="146" y2="94"/><line x1="158" y1="26" x2="158" y2="32"/><line x1="158" y1="88" x2="158" y2="94"/>
</g>
<circle class="led" cx="158" cy="44" r="3"/>
<!-- learn: small neural network -->
<g class="edges"><line x1="440" y1="36" x2="480" y2="24"/><line x1="440" y1="36" x2="480" y2="48"/><line x1="440" y1="36" x2="480" y2="72"/><line x1="440" y1="36" x2="480" y2="96"/><line x1="440" y1="60" x2="480" y2="24"/><line x1="440" y1="60" x2="480" y2="48"/><line x1="440" y1="60" x2="480" y2="72"/><line x1="440" y1="60" x2="480" y2="96"/><line x1="440" y1="84" x2="480" y2="24"/><line x1="440" y1="84" x2="480" y2="48"/><line x1="440" y1="84" x2="480" y2="72"/><line x1="440" y1="84" x2="480" y2="96"/><line x1="480" y1="24" x2="520" y2="42"/><line x1="480" y1="24" x2="520" y2="78"/><line x1="480" y1="48" x2="520" y2="42"/><line x1="480" y1="48" x2="520" y2="78"/><line x1="480" y1="72" x2="520" y2="42"/><line x1="480" y1="72" x2="520" y2="78"/><line x1="480" y1="96" x2="520" y2="42"/><line x1="480" y1="96" x2="520" y2="78"/></g>
<!-- rail + travelling pulse -->
<path class="rail" d="M172 60 H236 V40 H336 V60 H420 H540 H624 V80 H704 V60 H778"/>
<path class="pulse" d="M172 60 H236 V40 H336 V60 H420 H540 H624 V80 H704 V60 H778" pathLength="100"/>
<circle class="n c0" cx="440" cy="36" r="4.5"/><circle class="n c0" cx="440" cy="60" r="4.5"/><circle class="n c0" cx="440" cy="84" r="4.5"/><circle class="n c1" cx="480" cy="24" r="4.5"/><circle class="n c1" cx="480" cy="48" r="4.5"/><circle class="n c1" cx="480" cy="72" r="4.5"/><circle class="n c1" cx="480" cy="96" r="4.5"/><circle class="n c2" cx="520" cy="42" r="4.5"/><circle class="n c2" cx="520" cy="78" r="4.5"/>
<!-- connect: web interface -->
<g class="ink2">
  <rect x="778" y="20" width="120" height="76" rx="6"/>
  <path d="M778 32 H898"/>
</g>
<g fill="#9AADC1"><circle cx="787" cy="26" r="1.8"/><circle cx="794" cy="26" r="1.8"/><circle cx="801" cy="26" r="1.8"/></g>
<g class="bars"><rect x="796" y="60" width="10" height="16" rx="1.5"/><rect x="812" y="50" width="10" height="26" rx="1.5"/><rect x="828" y="56" width="10" height="20" rx="1.5"/><rect x="844" y="42" width="10" height="34" rx="1.5"/><rect x="860" y="48" width="10" height="28" rx="1.5"/></g>
<path d="M878 44 V76 M884 52 V76" stroke="#9AADC1" stroke-opacity=".5" stroke-width="1.5"/>
<text class="lbl" x="131" y="114">SENSE</text>
<text class="lbl" x="480" y="114">LEARN</text>
<text class="lbl" x="838" y="114">CONNECT</text>
</svg>
