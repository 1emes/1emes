<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="CubeSat GamaSat-01 em órbita apontando seu sensor para o oceano, onde uma mancha de óleo é segmentada e cruzada com a posição AIS de uma embarcação">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F0"/><stop offset=".7" stop-color="#EEF3F8"/><stop offset="1" stop-color="#F7F9FC"/></linearGradient>
  <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC6DA"/><stop offset="1" stop-color="#D5E7F0"/></linearGradient>
  <linearGradient id="fov" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#087E8B" stop-opacity=".05"/><stop offset="1" stop-color="#087E8B" stop-opacity=".28"/></linearGradient>
  <radialGradient id="slick" cx=".45" cy=".5" r=".6"><stop offset="0" stop-color="#995A13" stop-opacity=".75"/><stop offset=".6" stop-color="#6D4AC7" stop-opacity=".45"/><stop offset="1" stop-color="#6D4AC7" stop-opacity=".1"/></radialGradient>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="frame"><rect width="1200" height="400" rx="14"/></clipPath>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .tw { animation: tw 5s ease-in-out infinite; }
  .sat { animation: float 6s ease-in-out infinite; }
  .led { animation: blink 2.4s steps(1) infinite; }
  .fov { animation: scan 6s ease-in-out infinite; }
  .sweep { animation: sweep 6s ease-in-out infinite; }
  .contour { stroke-dasharray: 6 5; animation: march 1.6s linear infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
  .link { stroke-dasharray: 3 4; animation: march 1.2s linear infinite; }
  .orbit { stroke-dasharray: 2 7; animation: orbit 30s linear infinite; }
  @keyframes tw { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .2; } }
  @keyframes scan { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes sweep { 0% { transform: translateX(-60px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(60px); opacity: 0; } }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  @keyframes orbit { to { stroke-dashoffset: -180; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
