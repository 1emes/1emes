<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Matheus Lemes — uma imagem passa por camadas convolucionais e por uma rede neural até a classe prevista">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070C18"/><stop offset=".6" stop-color="#0B1220"/><stop offset="1" stop-color="#111A30"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B6A0FF" stop-opacity=".22"/><stop offset="1" stop-color="#B6A0FF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9AADC1" fill-opacity=".16"/></pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="14"/></clipPath>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .pulse { fill: none; stroke: #57D9E8; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 10 400; stroke-dashoffset: 10; animation: travel 4.5s linear infinite; }
  .n { fill: #0B1220; stroke: #B6A0FF; stroke-width: 1.6; }
  .hot { animation: hot 4.5s ease-in-out infinite; }
  .scan { animation: scan 4.5s ease-in-out infinite; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 4.5s ease-out infinite; }
  .fm { animation: fm 4.5s ease-in-out infinite; }
  @keyframes travel { 0% { stroke-dashoffset: 10; } 90%, 100% { stroke-dashoffset: -400; } }
  @keyframes hot { 0%, 70%, 100% { fill-opacity: .25; } 85% { fill-opacity: 1; } }
  @keyframes scan { 0% { transform: translate(0,0); } 25% { transform: translate(52px,0); } 50% { transform: translate(52px,52px); } 75% { transform: translate(0,52px); } 100% { transform: translate(0,0); } }
  @keyframes ping { 0%, 75% { transform: scale(.7); opacity: 0; } 80% { opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes fm { 0%, 100% { opacity: .55; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { stroke-dashoffset: -120; } }
</style>
